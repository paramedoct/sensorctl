[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorctl"
version = "0.1.0"
description = "Configuration-driven sensor time-series collector"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "sensorctl contributors" }]
dependencies = [
    "pyserial>=3.5,<4",
    "smbus2>=0.5,<1",
    "spidev>=3.6,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "ruff>=0.15,<1",
]

[project.scripts]
sensorctl = "commands:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["drivers", "storage", "transports"]
py-modules = ["application", "commands", "config", "control", "model", "runtime"]

[tool.setuptools.package-data]
storage = ["schema.sql"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
exclude = ["^build/", "^dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
